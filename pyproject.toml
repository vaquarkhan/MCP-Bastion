[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-python"
version = "4.0.1"
description = "Security middleware for MCP servers protecting LLM agents from prompt injection, resource exhaustion, and PII leakage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Vaquar Khan" }
]
keywords = ["mcp", "security", "middleware", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
policy = [
    "pyyaml>=6.0",
    "jsonpath-ng>=1.6.0",
]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]
redis = [
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/MCP-Bastion"
Repository = "https://github.com/vaquarkhan/MCP-Bastion"
Documentation = "https://github.com/vaquarkhan/MCP-Bastion#readme"

[project.scripts]
mcp-bastion = "mcp_bastion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard" = "dashboard"

[tool.hatch.build.targets.sdist]
include = ["src/mcp_bastion", "dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mcp_bastion"]
omit = [
    # Heavy ML / spaCy path - covered by dedicated smoke tests, excluded from line gate.
    "*/pii_redaction.py",
    "*/prompt_guard.py",
    "*/demo_live_traffic.py",
    # CLI / local dashboard / offline scanners: large I/O surfaces; runtime pillars are the gate.
    "*/cli.py",
    "*/dashboard_local.py",
    "*/osv_scan.py",
    "*/skill_scan.py",
]

[tool.coverage.report]
# Full 1.0.15+ tree + demos: ≥92% on measured `mcp_bastion` (pii + prompt excluded; see [tool.coverage.run]).
fail_under = 92
exclude_lines = ["pragma: no cover"]
