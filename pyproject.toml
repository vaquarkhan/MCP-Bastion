[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-python"
version = "1.0.12"
description = "Security middleware for MCP servers protecting LLM agents from prompt injection, resource exhaustion, and PII leakage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Viquar Khan" }
]
keywords = ["mcp", "security", "middleware", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
policy = [
    "pyyaml>=6.0",
]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/mcp-bastion/mcp-bastion"
Repository = "https://github.com/mcp-bastion/mcp-bastion"
Documentation = "https://github.com/mcp-bastion/mcp-bastion#readme"

[project.scripts]
mcp-bastion = "mcp_bastion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_bastion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mcp_bastion"]
omit = [
    "*/pii_redaction.py",
    "*/prompt_guard.py",
]

[tool.coverage.report]
fail_under = 99
exclude_lines = ["pragma: no cover"]
