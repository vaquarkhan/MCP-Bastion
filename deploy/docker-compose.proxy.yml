# Local MCP reverse proxy — TLS + OAuth in production; edge token for Bastion agent_iam / edge_auth.
#
# Usage (development):
#   docker compose -f deploy/docker-compose.proxy.yml up
#
# Browser traffic must NOT hit raw MCP HTTP on localhost. Terminate TLS and inject
# bastion_edge_token (or per-agent bastion_agent_token) at the gateway.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp-upstream:
    image: ghcr.io/vaquarkhan/mcp-bastion-proxy:v2.0.0
    network_mode: host
    environment:
      BASTION_CONFIG: /config/bastion.yaml
    volumes:
      - ../bastion.yaml.example:/config/bastion.yaml:ro
