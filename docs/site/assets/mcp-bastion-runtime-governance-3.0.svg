<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">MCP-Bastion runtime governance pillars</title>
  <desc id="desc">Opt-in enterprise pillars around the MCP request path</desc>
  <rect width="960" height="420" rx="16" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">Runtime governance (opt-in)</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">One bastion.yaml · defaults off for advanced pillars</text>

  <rect x="300" y="160" width="360" height="100" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="480" y="200" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">MCP-Bastion</text>
  <text x="480" y="228" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="12">middleware · proxy · pillars</text>

  <!-- top row -->
  <rect x="40" y="90" width="200" height="56" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="140" y="125" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Exfiltration canary</text>

  <rect x="280" y="90" width="200" height="56" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="380" y="125" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">ATR / threat feeds</text>

  <rect x="520" y="90" width="200" height="56" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="620" y="125" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">LLM scanner</text>

  <rect x="720" y="90" width="200" height="56" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="820" y="125" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Auto-repave</text>

  <!-- bottom row -->
  <rect x="40" y="300" width="200" height="56" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="140" y="335" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Secret redaction</text>

  <rect x="280" y="300" width="200" height="56" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="380" y="335" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Agent IAM / RBAC</text>

  <rect x="520" y="300" width="200" height="56" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="620" y="335" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Observe mode</text>

  <rect x="720" y="300" width="200" height="56" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="820" y="335" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Compliance report</text>

  <line x1="140" y1="146" x2="400" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="380" y1="146" x2="440" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="620" y1="146" x2="520" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="820" y1="146" x2="560" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="300" x2="400" y2="260" stroke="#475569" stroke-width="1.5"/>
  <line x1="380" y1="300" x2="440" y2="260" stroke="#475569" stroke-width="1.5"/>
  <line x1="620" y1="300" x2="520" y2="260" stroke="#475569" stroke-width="1.5"/>
  <line x1="820" y1="300" x2="560" y2="260" stroke="#475569" stroke-width="1.5"/>

  <text x="480" y="400" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Full MCP surface: tools · resources · prompts · sampling · elicitation</text>
