<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">MCP-Bastion reversible PII vault</title>
  <desc id="desc">Outbound tool results are abstracted to typed vault tokens; inbound tool arguments are hydrated before the MCP server executes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1120" height="520" fill="url(#bg)"/>

  <text x="48" y="44" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">PII Vault - Abstract outbound, hydrate inbound</text>
  <text x="48" y="72" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Opt-in · Presidio detect · CSPRNG tokens · default destructive redact unchanged</text>

  <!-- Agent -->
  <rect x="48" y="110" width="200" height="100" rx="14" fill="url(#card)" stroke="#334155"/>
  <text x="68" y="150" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">Agent / LLM</text>
  <text x="68" y="178" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">sees {{pii:&}} only</text>

  <line x1="260" y1="160" x2="310" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bastion -->
  <rect x="320" y="100" width="480" height="300" rx="16" fill="url(#card)" stroke="#059669"/>
  <rect x="320" y="100" width="480" height="40" rx="16" fill="url(#emerald)"/>
  <rect x="320" y="124" width="480" height="16" fill="url(#emerald)"/>
  <text x="340" y="126" fill="#042f2e" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">MCP-Bastion middleware</text>

  <rect x="344" y="160" width="200" height="90" rx="10" fill="#0b1220" stroke="#34d399"/>
  <text x="360" y="190" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">1. Abstract</text>
  <text x="360" y="212" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">tool result ’ vault</text>
  <text x="360" y="232" fill="#64748b" font-family="Consolas, monospace" font-size="10">alice@& ’ {{pii:EMAIL:&}}</text>

  <rect x="576" y="160" width="200" height="90" rx="10" fill="#0b1220" stroke="#fbbf24"/>
  <text x="592" y="190" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">2. Hydrate</text>
  <text x="592" y="212" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">tool args ’ plaintext</text>
  <text x="592" y="232" fill="#64748b" font-family="Consolas, monospace" font-size="10">{{pii:&}} ’ alice@&</text>

  <rect x="344" y="270" width="432" height="100" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="360" y="300" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Session vault (StateBackend)</text>
  <text x="360" y="324" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Memory default · Redis opt-in · TTL wipe · CSPRNG ids</text>
  <text x="360" y="348" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Same value ’ same token within session (LLM coherence)</text>

  <line x1="810" y1="160" x2="860" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MCP server -->
  <rect x="870" y="110" width="200" height="100" rx="14" fill="url(#card)" stroke="#334155"/>
  <text x="890" y="150" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">MCP server</text>
  <text x="890" y="178" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">tools get real PII</text>

  <rect x="48" y="430" width="1024" height="60" rx="12" fill="url(#card)" stroke="#334155"/>
  <text x="68" y="466" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">pii_vault.enabled: false by default - destructive Presidio redaction remains the production default path</text>
</svg>
