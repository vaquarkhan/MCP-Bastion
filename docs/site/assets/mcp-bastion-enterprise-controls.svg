<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise controls: ATR, threat feeds, compliance</title>
  <desc id="desc">Community ATR rules and remote threat feeds merge into content_filter; audit feeds compliance reports</desc>
  <rect width="960" height="360" rx="16" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">ATR rules · threat feeds · compliance evidence</text>

  <rect x="40" y="80" width="200" height="80" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="115" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">ATR YAML</text>
  <text x="140" y="138" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">atr-rules/*.yaml</text>

  <rect x="40" y="200" width="200" height="80" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="235" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Threat feeds</text>
  <text x="140" y="258" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">remote JSON · hot reload</text>

  <polygon points="256,200 280,210 256,220" fill="#64748b"/>
  <line x1="240" y1="120" x2="280" y2="210" stroke="#64748b" stroke-width="2"/>
  <line x1="240" y1="240" x2="280" y2="210" stroke="#64748b" stroke-width="2"/>

  <rect x="300" y="140" width="280" height="140" rx="12" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
  <text x="440" y="185" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">content_filter</text>
  <text x="440" y="210" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="12">+ PromptGuard heuristics</text>
  <text x="440" y="240" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="12">merged patterns at runtime</text>

  <line x1="580" y1="210" x2="640" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="636,204 648,210 636,216" fill="#94a3b8"/>

  <rect x="660" y="80" width="260" height="80" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="790" y="115" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Block / allow</text>
  <text x="790" y="138" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">JSON-RPC errors / pass-through</text>

  <rect x="660" y="200" width="260" height="80" rx="10" fill="#78350f" stroke="#fbbf24"/>
  <text x="790" y="235" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">mcp-bastion report</text>
  <text x="790" y="258" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, system-ui, sans-serif" font-size="11">SOC2 · GDPR · ISO · NIST packs</text>

  <line x1="440" y1="280" x2="440" y2="300" stroke="#64748b" stroke-width="1.5"/>
  <line x1="440" y1="300" x2="790" y2="300" stroke="#64748b" stroke-width="1.5"/>
  <line x1="790" y1="300" x2="790" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="340" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Audit JSONL feeds evidence reports (not certification)</text>
</svg>
