<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title desc">
  <title id="title">Secret pattern redaction</title>
  <desc id="desc">Outbound tool results scanned; matching patterns replaced, hashed, masked, or removed</desc>
  <rect width="860" height="260" rx="16" fill="#0f172a"/>
  <text x="430" y="36" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Secret pattern redaction</text>

  <rect x="40" y="90" width="200" height="80" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="125" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Tool result</text>
  <text x="140" y="148" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">sk-abc&xyz</text>

  <line x1="240" y1="130" x2="300" y2="130" stroke="#64748b" stroke-width="2"/>
  <polygon points="296,124 308,130 296,136" fill="#94a3b8"/>

  <rect x="310" y="70" width="240" height="120" rx="12" fill="#78350f" stroke="#fbbf24"/>
  <text x="430" y="110" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">secrets.redact_patterns</text>
  <text x="430" y="138" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, system-ui, sans-serif" font-size="12">replace · hash · mask · remove</text>
  <text x="430" y="162" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="11">on outbound path</text>

  <line x1="550" y1="130" x2="610" y2="130" stroke="#64748b" stroke-width="2"/>
  <polygon points="606,124 618,130 606,136" fill="#94a3b8"/>

  <rect x="620" y="90" width="200" height="80" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="720" y="125" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">To model / client</text>
  <text x="720" y="148" text-anchor="middle" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11">sk-a***xyz</text>

  <text x="430" y="230" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Complements Presidio PII and reversible pii_vault</text>
</svg>
