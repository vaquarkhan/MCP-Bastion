[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-groq"
version = "2.0.1"
description = "MCP-Bastion security middleware for Groq  -  prompt injection, PII, and rate-limit protection for ultra-fast LLM inference"
readme = "README.md"
license = { text = "See LICENSE and COMMERCIAL_LICENSE.md in the MCP-Bastion repository." }
requires-python = ">=3.10"
authors = [{ name = "Vaquar Khan" }]
keywords = ["mcp", "bastion", "groq", "security", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp-bastion-python>=2.0.0",
    "groq>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/MCP-Bastion"
Repository = "https://github.com/vaquarkhan/MCP-Bastion"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion_groq"]
