[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-mistral"
version = "3.1.1"
description = "MCP-Bastion security middleware for Mistral AI  -  prompt injection, PII, and rate-limit protection"
readme = "README.md"
license = { text = "See LICENSE and COMMERCIAL_LICENSE.md in the MCP-Bastion repository." }
requires-python = ">=3.10"
authors = [{ name = "Vaquar Khan" }]
keywords = ["mcp", "bastion", "mistral", "security", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp-bastion-python>=2.0.0",
    "mistralai>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/MCP-Bastion"
Repository = "https://github.com/vaquarkhan/MCP-Bastion"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion_mistral"]
