[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-openai"
version = "0.1.0"
description = "MCP-Bastion security middleware for OpenAI — prompt injection, PII, and rate-limit protection for GPT agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Viquar Khan" }
]
keywords = ["mcp", "bastion", "openai", "gpt", "security", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp-bastion-python>=1.0.11",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/MCP-Bastion"
Repository = "https://github.com/vaquarkhan/MCP-Bastion"
Documentation = "https://github.com/vaquarkhan/MCP-Bastion/tree/main/integrations/mcp-bastion-openai"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion_openai"]
