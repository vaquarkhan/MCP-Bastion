[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-llamaindex"
version = "0.1.1"
description = "MCP-Bastion security middleware for LlamaIndex — prompt injection, PII, and rate-limit protection for RAG pipelines"
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Viquar Khan" }]
keywords = ["mcp", "bastion", "llamaindex", "rag", "security", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp-bastion-python>=1.0.13",
    "llama-index-core>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/MCP-Bastion"
Repository = "https://github.com/vaquarkhan/MCP-Bastion"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion_llamaindex"]
