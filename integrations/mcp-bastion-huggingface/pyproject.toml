[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bastion-huggingface"
version = "0.1.2"
description = "MCP-Bastion security middleware for Hugging Face Inference. Prompt injection, PII, and rate-limit protection."
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Viquar Khan" }]
keywords = ["mcp", "bastion", "huggingface", "transformers", "security", "llm", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp-bastion-python>=1.0.13",
    "huggingface-hub>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/vaquarkhan/MCP-Bastion"
Repository = "https://github.com/vaquarkhan/MCP-Bastion"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bastion_huggingface"]
