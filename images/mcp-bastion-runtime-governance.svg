<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Zero-Trust runtime governance</title>
  <desc id="desc">Full MCP surface, Redis scale option, Agent IAM, beyond-OWASP coverage</desc>
  <rect width="960" height="380" rx="16" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Zero-Trust runtime governance</text>

  <rect x="60" y="80" width="160" height="60" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="115" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">MCP client</text>

  <line x1="220" y1="110" x2="300" y2="110" stroke="#64748b" stroke-width="2"/>
  <polygon points="296,104 308,110 296,116" fill="#94a3b8"/>

  <rect x="310" y="60" width="340" height="200" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">MCP-Bastion</text>
  <text x="480" y="120" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, system-ui, sans-serif" font-size="11">tools · resources · prompts · sampling · elicitation</text>
  <text x="480" y="155" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Agent IAM · RBAC · PromptGuard · PII</text>
  <text x="480" y="178" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Rate / cost · replay · schema · canary</text>
  <text x="480" y="210" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">state: memory (default) or Redis</text>
  <text x="480" y="235" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">observe · enforce · audit JSONL</text>

  <line x1="650" y1="160" x2="730" y2="160" stroke="#64748b" stroke-width="2"/>
  <polygon points="726,154 738,160 726,166" fill="#94a3b8"/>

  <rect x="740" y="80" width="160" height="60" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="820" y="115" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">MCP tools</text>

  <rect x="80" y="300" width="200" height="50" rx="8" fill="#312e81" stroke="#818cf8"/>
  <text x="180" y="330" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Dashboard /metrics</text>

  <rect x="380" y="300" width="200" height="50" rx="8" fill="#78350f" stroke="#fbbf24"/>
  <text x="480" y="330" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Optional OTEL OTLP</text>

  <rect x="680" y="300" width="200" height="50" rx="8" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="780" y="330" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Beyond-OWASP map</text>
</svg>
