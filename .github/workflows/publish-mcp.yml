name: Build, Test, and Publish MCP-Bastion

on:
  push:
    tags:
      - 'v*' # This workflow will only trigger when you push a version tag (e.g., v1.0.0)

jobs:
  build-and-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # CRITICAL: This enables secure OIDC Trusted Publishing for PyPI, npm, and the MCP Registry

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ==========================================
      # 1. TYPESCRIPT (npm) BUILD & PUBLISH
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install, Lint, and Test (TypeScript)
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

      - name: Publish to npm
        run: npm publish --workspace=@mcp-bastion/core --access public
        # Note: No token needed here because of npm Trusted Publishers (OIDC)

      # ==========================================
      # 2. PYTHON (PyPI) BUILD & PUBLISH
      # ==========================================
      - name: Install uv (Python Package Manager)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build Python distributions
        run: uv build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Note: No username/password needed here because of PyPI Trusted Publishers (OIDC)

      # ==========================================
      # 3. MCP REGISTRY PUBLISH
      # ==========================================
      - name: Download MCP Publisher CLI
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/latest/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
