name: Publish MCP-Bastion

on:
  push:
    tags:
      - "v*"

jobs:
  publish-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build Python package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
        continue-on-error: true

  publish-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript package
        run: npm run build --workspace=@mcp-bastion/core

      - name: Publish to npm
        run: npm publish --workspace=@mcp-bastion/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: [publish-python, publish-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          curl -sSL -o mcp-publisher "$(curl -sSL https://api.github.com/repos/modelcontextprotocol/publisher/releases/latest | jq -r '.assets[] | select(.name | contains("linux")) | .browser_download_url')"
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: ./mcp-publisher
        env:
          MCP_PUBLISH_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
        continue-on-error: true
