name: Build, Test, and Publish MCP-Bastion

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # CRITICAL: This enables secure OIDC Trusted Publishing for PyPI, npm, and the MCP Registry

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ==========================================
      # 1. TYPESCRIPT (npm) BUILD & PUBLISH
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # npm Trusted Publishers requires Node 22.14+
          registry-url: 'https://registry.npmjs.org'

      - name: Install, Lint, and Test (TypeScript)
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

      - name: Publish to npm
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: npm publish --workspace=@mcp-bastion/core --access public
        # Requires npm Trusted Publishers (OIDC). Set up at npmjs.com

      # ==========================================
      # 2. PYTHON (PyPI) BUILD & PUBLISH
      # ==========================================
      - name: Install uv (Python Package Manager)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Build Python distributions
        run: uv build

      - name: Publish distribution to PyPI
        if: github.ref_type == 'tag'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        # Requires PyPI Trusted Publishers (OIDC). Set up at pypi.org

      # ==========================================
      # 3. MCP REGISTRY PUBLISH
      # ==========================================
      - name: Download MCP Publisher CLI
        if: github.ref_type == 'tag'
        run: |
          MCP_VER="v1.4.1"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_VER}/mcp-publisher_${OS}_${ARCH}.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Publish to official MCP Registry
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
