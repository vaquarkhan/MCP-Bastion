name: Build, Test, and Publish MCP-Bastion

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts (npm / PyPI / MCP Registry) from this ref"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-and-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for PyPI, npm Trusted Publishing, MCP Registry

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Decide whether to publish
        id: pub
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "do=true" >> "$GITHUB_OUTPUT"
          else
            echo "do=false" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================
      # 1. TYPESCRIPT (npm) BUILD & PUBLISH
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # npm Trusted Publishers requires Node 22.14+
          registry-url: 'https://registry.npmjs.org'

      - name: Install, Lint, and Test (TypeScript)
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

      - name: Publish to npm
        if: steps.pub.outputs.do == 'true'
        id: npm_publish
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          PKG="@mcp-bastion/core"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "Package exists on npm - publishing with OIDC provenance (do not set NODE_AUTH_TOKEN)."
            unset NODE_AUTH_TOKEN || true
            npm publish --workspace="$PKG" --access public --provenance
          elif [ -n "${NPM_TOKEN:-}" ]; then
            echo "First-time / bootstrap publish via NPM_TOKEN (OIDC Trusted Publisher cannot create a new package)."
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            npm publish --workspace="$PKG" --access public
            echo "::notice title=npm bootstrap::Published $PKG. Configure Trusted Publisher at https://www.npmjs.com/package/$PKG/access then future tag publishes can omit NPM_TOKEN."
          else
            echo "::warning title=npm publish skipped::$PKG is not on the registry yet. Add repo secret NPM_TOKEN for one bootstrap publish, then enable Trusted Publisher on npmjs.com for workflow publish-mcp.yml. See docs/PUBLISHING_NPM_AND_REGISTRY.md"
            exit 1
          fi

      # ==========================================
      # 2. PYTHON (PyPI) BUILD & PUBLISH
      # ==========================================
      - name: Install uv (Python Package Manager)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Build Python distributions
        run: uv build

      # ==========================================
      # 2b. CYCLONEDX SBOM (CRA / OpenSSF) - fail-safe
      # ==========================================
      - name: Generate CycloneDX SBOM (Python)
        id: sbom_py
        continue-on-error: true
        run: |
          python scripts/generate_sbom.py \
            --pyproject pyproject.toml \
            --output bom.json
          python scripts/generate_sbom.py \
            --npm packages/core/package.json \
            --output bom-npm.json

      - name: Upload CycloneDX SBOM artifacts
        if: always() && steps.sbom_py.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mcp-bastion-sbom-${{ github.ref_name }}
          path: |
            bom.json
            bom-npm.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish distribution to PyPI
        if: steps.pub.outputs.do == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        # Requires PyPI Trusted Publishers (OIDC). Set up at pypi.org

      # ==========================================
      # 3. MCP REGISTRY PUBLISH
      # ==========================================
      - name: Download MCP Publisher CLI
        if: steps.pub.outputs.do == 'true'
        run: |
          # v1.4.1 requested legacy audience "mcp-registry"; production now expects
          # https://registry.modelcontextprotocol.io (fixed in newer mcp-publisher).
          MCP_VER="v1.7.9"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_VER}/mcp-publisher_${OS}_${ARCH}.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      - name: Publish to official MCP Registry
        if: steps.pub.outputs.do == 'true'
        continue-on-error: false
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
