name: Update ecosystem download stats

on:
  schedule:
    # Daily 06:15 UTC — keeps README / Pages total fresh
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Aggregate PyPI download totals
        run: python scripts/update_ecosystem_downloads.py

      # main is protected (PR required). Open/update a bot PR instead of pushing to main.
      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh ecosystem PyPI download totals"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "chore: refresh ecosystem PyPI download totals"
          body: |
            Automated refresh of PePy / pypistats totals for README + Pages badges.

            - `docs/site/assets/ecosystem-downloads.json`
            - `docs/site/assets/ecosystem-downloads-badge.json`
            - `docs/site/assets/badges/*-downloads.json`
          branch: chore/ecosystem-downloads
          delete-branch: true
          add-paths: |
            docs/site/assets/ecosystem-downloads.json
            docs/site/assets/ecosystem-downloads-badge.json
            docs/site/assets/badges/

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --auto || \
            echo "Auto-merge not enabled or blocked by rules; PR left open for review."
