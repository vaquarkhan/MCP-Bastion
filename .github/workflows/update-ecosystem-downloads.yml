name: Update ecosystem download stats

on:
  schedule:
    # Daily 06:15 UTC — keeps README / Pages total fresh
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require admin token for protected main
        env:
          ECOSYSTEM_STATS_TOKEN: ${{ secrets.ECOSYSTEM_STATS_TOKEN }}
        run: |
          if [ -z "${ECOSYSTEM_STATS_TOKEN}" ]; then
            echo "::error::Add repo secret ECOSYSTEM_STATS_TOKEN (PAT with repo scope from an admin account)."
            echo "main is ruleset-protected; GITHUB_TOKEN cannot push or bypass. See docs in workflow comment."
            exit 1
          fi

      # Admin PAT bypasses MCP-Bastion-rules (RepositoryRole admin). GITHUB_TOKEN cannot.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ECOSYSTEM_STATS_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Aggregate PyPI download totals
        run: python scripts/update_ecosystem_downloads.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/site/assets/ecosystem-downloads.json docs/site/assets/ecosystem-downloads-badge.json docs/site/assets/badges/
          if git diff --staged --quiet; then
            echo "No download-stat changes"
            exit 0
          fi
          git commit -m "chore: refresh ecosystem PyPI download totals"
          git push
