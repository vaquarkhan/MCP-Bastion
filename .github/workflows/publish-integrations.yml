name: Publish Integration Packages

on:
  push:
    tags:
      - 'integration-v*'
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (or 'all')"
        required: true
        default: all
        type: choice
        options:
          - all
          - mcp-bastion-langchain
          - mcp-bastion-openai
          - mcp-bastion-anthropic
          - mcp-bastion-bedrock
          - mcp-bastion-gemini
          - mcp-bastion-crewai
          - mcp-bastion-llamaindex
          - mcp-bastion-groq
          - mcp-bastion-mistral
          - mcp-bastion-cohere
          - mcp-bastion-azure
          - mcp-bastion-vertexai
          - mcp-bastion-huggingface
          - mcp-bastion-deepseek
          - mcp-bastion-together
          - mcp-bastion-fireworks
          - mcp-bastion-fastmcp
          - mcp-bastion-litellm
          - mcp-bastion-ollama
          - mcp-bastion-openrouter
          - mcp-bastion-xai
          - mcp-bastion-autogen
          - mcp-bastion-langgraph
          - mcp-bastion-pydantic-ai
          - mcp-bastion-openai-agents

jobs:
  publish-integrations:
    name: Publish Integration Packages to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - mcp-bastion-langchain
          - mcp-bastion-openai
          - mcp-bastion-anthropic
          - mcp-bastion-bedrock
          - mcp-bastion-gemini
          - mcp-bastion-crewai
          - mcp-bastion-llamaindex
          - mcp-bastion-groq
          - mcp-bastion-mistral
          - mcp-bastion-cohere
          - mcp-bastion-azure
          - mcp-bastion-vertexai
          - mcp-bastion-huggingface
          - mcp-bastion-deepseek
          - mcp-bastion-together
          - mcp-bastion-fireworks
          - mcp-bastion-fastmcp
          - mcp-bastion-litellm
          - mcp-bastion-ollama
          - mcp-bastion-openrouter
          - mcp-bastion-xai
          - mcp-bastion-autogen
          - mcp-bastion-langgraph
          - mcp-bastion-pydantic-ai
          - mcp-bastion-openai-agents

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Debug package metadata
        if: |
          (
            github.event_name != 'workflow_dispatch' ||
            github.event.inputs.package == 'all' ||
            github.event.inputs.package == matrix.package
          ) &&
          (
            github.event_name != 'push' ||
            !contains(github.ref_name, 'mcp-bastion-') ||
            contains(github.ref_name, matrix.package)
          )
        run: |
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Tag/Ref name: ${{ github.ref_name }}"
          echo "Package: ${{ matrix.package }}"
          grep -n "^version = " integrations/${{ matrix.package }}/pyproject.toml || true
          grep -n "^license = " integrations/${{ matrix.package }}/pyproject.toml || true

      - name: Build ${{ matrix.package }}
        if: |
          (
            github.event_name != 'workflow_dispatch' ||
            github.event.inputs.package == 'all' ||
            github.event.inputs.package == matrix.package
          ) &&
          (
            github.event_name != 'push' ||
            !contains(github.ref_name, 'mcp-bastion-') ||
            contains(github.ref_name, matrix.package)
          )
        run: uv build
        working-directory: integrations/${{ matrix.package }}

      - name: Publish ${{ matrix.package }} to PyPI
        if: |
          (
            github.event_name != 'workflow_dispatch' ||
            github.event.inputs.package == 'all' ||
            github.event.inputs.package == matrix.package
          ) &&
          (
            github.event_name != 'push' ||
            !contains(github.ref_name, 'mcp-bastion-') ||
            contains(github.ref_name, matrix.package)
          )
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/${{ matrix.package }}/dist/
